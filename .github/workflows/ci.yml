name: Integración continua

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (\${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: \${{ matrix.os }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validar scripts Bash
        if: runner.os != 'Windows'
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Comprobar scripts PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem scripts/*.ps1 | ForEach-Object { $null = [scriptblock]::Create((Get-Content -Raw $_.FullName)) }
      - name: Comprobar espacios y formato del diff
        run: git diff --check
      - name: Compilar y ejecutar pruebas Linux
        if: runner.os == 'Linux'
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Compilar en Windows y macOS
        if: runner.os != 'Linux'
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package
